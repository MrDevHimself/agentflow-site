# Netlify reads this on every push to GitHub: it installs, builds, and publishes /dist.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old links that should still land somewhere useful
[[redirects]]
  from = "/services"
  to = "/"
  status = 301

[[redirects]]
  from = "/thankyou"
  to = "/pitch"
  status = 301

[[redirects]]
  from = "/thank-you"
  to = "/pitch"
  status = 301
